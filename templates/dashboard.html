<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Home Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      :root {
        --bg: #000;
        --card: #121212;
        --border: #1f1f1f;
        --text: #fff;
        --accent: #10b981;
        --warning: #f59e0b;
      }

      /* FIX: Overflow and flexible layout */
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 10px;
        height: 100vh;
        overflow: hidden;
        box-sizing: border-box;
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: 160px 1fr 200px;
        grid-template-rows: 40px 1fr;
        gap: 10px;
        height: 100%;
      }

      header {
        grid-column: span 3;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
      }
      .card {
        background: var(--card);
        border-radius: 12px;
        padding: 12px;
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .metrics-col,
      .controls-col {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .status-tag {
        font-size: 0.6rem;
        text-transform: uppercase;
        color: #71717a;
        font-weight: 800;
      }
      .metric-value {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--accent);
      }

      /* FIX: Prevent overflow */
      .chart-container {
        position: relative;
        flex: 1;
        min-height: 0;
        width: 100%;
      }

      button {
        background: #1f1f1f;
        color: white;
        border: 1px solid var(--border);
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.75rem;
        width: 100%;
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-grid">
      <header>
        <h2 style="margin: 0; font-size: 1rem">
          Smart Home
          <span style="font-weight: 400; color: #71717a">Energy Hub</span>
        </h2>
        <div id="clock" style="color: var(--accent); font-family: monospace">
          00:00:00
        </div>
        <div style="display: flex; gap: 10px; align-items: center">
          <span
            id="record-count"
            style="
              background: #1f1f1f;
              color: var(--accent);
              padding: 4px 10px;
              border-radius: 20px;
              font-size: 10px;
              font-weight: 800;
              border: 1px solid var(--border);
            "
            >0 RECORDS</span
          >
          <span
            id="health-dot"
            style="
              padding: 4px 10px;
              border-radius: 20px;
              font-size: 9px;
              font-weight: 800;
              background: #f43f5e;
              color: #000;
            "
            >OFFLINE</span
          >
        </div>
      </header>

      <div class="metrics-col">
        <div class="card">
          <span class="status-tag">Energy</span>
          <div class="metric-value" id="watts">0 W</div>
          <small style="color: var(--accent)"
            >Lux: <span id="lux">0</span></small
          >
        </div>
        <div class="card">
          <span class="status-tag">Climate</span>
          <div class="metric-value" id="temp">0.0°C</div>
          <small style="color: #3b82f6"
            >Hum: <span id="humidity">0</span>%</small
          >
        </div>
        <div class="card">
          <span class="status-tag">Status</span>
          <div
            id="occupancy"
            style="font-size: 0.9rem; font-weight: 700; color: #fff"
          >
            Detecting...
          </div>
        </div>
        <div class="card" style="border-top: 3px solid var(--accent)">
          <span class="status-tag">System Classification</span>
          <div
            id="class-label"
            style="font-size: 0.9rem; font-weight: 500; margin-top: 5px"
          >
            LOAD...
          </div>
        </div>
      </div>

      <div class="card">
        <span class="status-tag" style="margin-bottom: 10px"
          >Quad-Axis Real Time Stream</span
        >
        <div class="chart-container">
          <canvas id="energyChart"></canvas>
        </div>
      </div>

      <div class="controls-col">
        <div class="card" style="border-left: 4px solid var(--warning)">
          <span class="status-tag">AI Insights</span>
          <p
            id="ai-status"
            style="font-size: 0.7rem; color: #a1a1aa; margin-top: 5px"
          >
            Synchronizing...
          </p>
        </div>
        <div class="card" style="flex: 1">
          <span class="status-tag">Controls</span>
          <button id="btn-1" onclick="toggleRelay(1)" style="margin-top: 10px">
            Light Grid
          </button>
          <button id="btn-2" onclick="toggleRelay(2)">HVAC Fan</button>
          <div
            style="
              border-top: 1px solid #333;
              margin-top: 10px;
              padding-top: 10px;
              font-size: 0.7rem;
              color: #aaa;
            "
          >
            <div style="display: flex; justify-content: space-between">
              <span>Light</span><span id="val-1">0 W</span>
            </div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                margin-top: 5px;
              "
            >
              <span>HVAC</span><span id="val-2">0 W</span>
            </div>
          </div>
        </div>
        <div class="card" style="border-bottom: 3px solid #8b5cf6">
          <span class="status-tag">Active Context</span>
          <select
            id="user-selector"
            onchange="changeUser(this.value)"
            style="
              background: #000;
              color: #fff;
              border: 1px solid #333;
              padding: 5px;
              border-radius: 4px;
              margin-top: 5px;
              font-size: 0.8rem;
            "
          >
            <option value="Default" selected>Default Profile</option>
            <option value="Nadine">Nadine (Cold Pref)</option>
            <option value="Regis">Regis (Energy Pref)</option>
          </select>
          <div
            id="active-user-display"
            style="
              font-size: 0.7rem;
              color: #8b5cf6;
              margin-top: 5px;
              font-weight: 700;
            "
          >
            USER: NADINE
          </div>
        </div>
      </div>
    </div>

    <script>
      setInterval(() => {
        document.getElementById("clock").innerText =
          new Date().toLocaleTimeString();
      }, 1000);

      const ctx = document.getElementById("energyChart").getContext("2d");
      const energyChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: [],
          datasets: [
            {
              label: "Watts",
              data: [],
              borderColor: "#10b981",
              yAxisID: "yWatts",
              tension: 0.4,
              borderWidth: 3,
              pointRadius: 0,
            },
            {
              label: "Lux",
              data: [],
              borderColor: "#fff",
              yAxisID: "yLux",
              tension: 0.4,
              borderWidth: 2,
              borderDash: [5, 5],
              pointRadius: 0,
            },
            {
              label: "Temp",
              data: [],
              borderColor: "#f59e0b",
              yAxisID: "yTemp",
              tension: 0.4,
              borderWidth: 3,
              pointRadius: 0,
            },
            {
              label: "Humid",
              data: [],
              borderColor: "#3b82f6",
              yAxisID: "yHum",
              tension: 0.4,
              borderWidth: 2,
              pointRadius: 0,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 0 },
          interaction: { intersect: false, mode: "index" },
          scales: {
            // LEFT SIDE
            yWatts: {
              position: "left",
              beginAtZero: false,
              ticks: { color: "#10b981" },
              title: { display: true, text: "Watts", color: "#10b981" },
            },
            yLux: {
              position: "left",
              beginAtZero: false,
              grid: { display: false },
              ticks: { color: "#fff", padding: 10 },
              title: { display: true, text: "Lux", color: "#fff" },
            },

            // RIGHT SIDE
            yTemp: {
              position: "right",
              beginAtZero: false,
              ticks: { color: "#f59e0b" },
              title: { display: true, text: "°C", color: "#f59e0b" },
            },
            yHum: {
              position: "right",
              beginAtZero: false,
              grid: { display: false },
              ticks: { color: "#3b82f6", padding: 10 },
              title: { display: true, text: "% Hum", color: "#3b82f6" },
            },

            x: { grid: { display: false }, ticks: { color: "#71717a" } },
          },
          plugins: {
            legend: {
              position: "top",
              labels: { color: "#fff", boxWidth: 8, font: { size: 9 } },
            },
          },
        },
      });

      async function updateDashboard() {
        try {
          const res = await fetch("/api/sensor-data");
          const data = await res.json();

          // Update Record Count
          document.getElementById("record-count").innerText =
            data.total_records.toLocaleString() + " RECORDS";

          // UI Updates
          document.getElementById("watts").innerText = data.watts + " W";
          document.getElementById("temp").innerText = data.temp + "°C";
          document.getElementById("lux").innerText = data.lux;
          document.getElementById("humidity").innerText = data.humidity;
          document.getElementById("occupancy").innerText = data.occupancy;
          document.getElementById("ai-status").innerText = data.ai_suggestion;
          document.getElementById("val-1").innerText = data.light_w + " W";
          document.getElementById("val-2").innerText = data.fan_w + " W";
          document.getElementById("class-label").innerText = data.class_label;
          document.getElementById("class-label").style.color = data.class_color;
          document.getElementById("active-user-display").innerText =
            "USER: " + data.user_context.toUpperCase();

          // Health online dot logic
          const dot = document.getElementById("health-dot");
          dot.style.background = data.online ? "#10b981" : "#f43f5e";
          dot.innerText = data.online ? "ONLINE" : "OFFLINE";

          // FIX: SURGICAL INDEX MAPPING
          // 0: Watts, 1: Lux, 2: Temp, 3: Humid
          const now = new Date().toLocaleTimeString();
          if (energyChart.data.labels.length > 30) {
            energyChart.data.labels.shift();
            energyChart.data.datasets.forEach((ds) => ds.data.shift());
          }
          energyChart.data.labels.push(now);
          energyChart.data.datasets[0].data.push(data.watts);
          energyChart.data.datasets[1].data.push(data.lux); // INDEX 1 = LUX
          energyChart.data.datasets[2].data.push(data.temp); // INDEX 2 = TEMP (Amber)
          energyChart.data.datasets[3].data.push(data.humidity); // INDEX 3 = HUMID (Blue)

          energyChart.update("none");
        } catch (e) {
          console.error("Poll failed", e);
        }
      }

      async function toggleRelay(id) {
        await fetch("/api/toggle-relay", {
          method: "POST",
          body: JSON.stringify({ id: id }),
        });
      }
      setInterval(updateDashboard, 1000);

      async function changeUser(val) {
        await fetch("/api/set-user", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user: val }),
        });
        document.getElementById("active-user-display").innerText =
          "USER: " + val.toUpperCase();
      }
    </script>
  </body>
</html>
